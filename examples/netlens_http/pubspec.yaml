name: example
description: "A project to showcase http and NetLens integration."
publish_to: 'none'

version: 1.0.0+3

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  netlens:
  netlens_http:
  http: ^1.4.0

dev_dependencies:
  flutter_lints: ^5.0.0

dependency_overrides:
  netlens:
    path: ../../packages/netlens
  netlens_http:
    path: ../../packages/netlens_http

flutter:
  uses-material-design: true
