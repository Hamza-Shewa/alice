name: netlens_chopper
description: "NetLens adapter for Chopper. Catches Chopper calls for the NetLens in-app HTTP inspector in Flutter apps."
version: 1.0.0
repository: https://github.com/Hamza-Shewa/alice
issue_tracker: https://github.com/Hamza-Shewa/alice/issues
topics:
  - http
  - inspector
  - netlens
  - chopper
  - interceptor

environment:
  sdk: ">=3.7.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  netlens: ^1.0.0
  chopper: ^8.2.0
  http: ^1.4.0
  uuid: ^4.5.1
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^5.0.0
  test: ^1.25.15
  netlens_test: ^1.0.0
  mocktail: ^1.0.4
  build_runner: ^2.5.4
  chopper_generator: ^8.2.0
  json_serializable: ^6.9.5
  json_annotation: ^4.9.0
  equatable: ^2.1.0
