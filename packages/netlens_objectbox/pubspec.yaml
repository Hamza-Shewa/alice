name: netlens_objectbox
description: "ObjectBox storage for NetLens. Keeps calls caught by the NetLens in-app HTTP inspector in an ObjectBox database across app restarts."
version: 1.0.0
repository: https://github.com/Hamza-Shewa/alice
issue_tracker: https://github.com/Hamza-Shewa/alice/issues
topics:
  - http
  - inspector
  - netlens
  - interceptor
  - objectbox

environment:
  sdk: ">=3.7.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  netlens: ^1.0.0
  json_annotation: ^4.9.0
  meta: ^1.16.0
  objectbox: ^4.3.0
  objectbox_flutter_libs: ^4.3.0
  path: ^1.9.1
  path_provider: ^2.1.5
  flat_buffers: ^23.5.26

dev_dependencies:
  build_runner: ^2.4.1
  flutter_lints: ^5.0.0
  json_serializable: ^6.9.5
  objectbox_generator: ^4.3.0
