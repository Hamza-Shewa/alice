name: netlens
description: "In-app HTTP inspector for Flutter. Browse calls, filter and search them, hide secrets, resend requests, export HAR, read GraphQL and see a timeline."
version: 1.0.0
repository: https://github.com/Hamza-Shewa/alice
issue_tracker: https://github.com/Hamza-Shewa/alice/issues
topics:
  - http
  - inspector
  - dio
  - chopper
  - interceptor

environment:
  sdk: ">=3.7.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^19.4.0
  rxdart: ^0.28.0
  path_provider: ^2.1.5
  permission_handler: ^13.0.1
  package_info_plus: ^10.2.1
  open_filex: ^4.6.0
  sensors_plus: ^6.1.1
  share_plus: ^13.3.0
  collection: ^1.19.1
  url_launcher: ^6.3.2
  equatable: ^2.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  lints: ^6.0.0
  test: ^1.25.15
  mocktail: ^1.0.4