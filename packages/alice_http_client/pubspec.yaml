name: alice_http_client
description: "Alice + HTTP Client integration. It contains plugin for Alice which allows to use Http Client."
version: 1.0.7
repository: https://github.com/jhomlala/alice
homepage: https://github.com/jhomlala/alice
publish_to: none
topics:
  - http
  - inspector
  - alice
  - interceptor

environment:
  sdk: ">=3.7.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  alice:
    git:
      url: https://github.com/Hamza-Shewa/alice.git
      ref: master
      path: packages/alice
dev_dependencies:
  flutter_lints: ^5.0.0
  alice_test:
    git:
      url: https://github.com/Hamza-Shewa/alice.git
      ref: master
      path: packages/alice_test
  mocktail: ^1.0.4
  test: ^1.25.15